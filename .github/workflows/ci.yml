name: ContractClaw CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-contractclaw:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate sample contracts
        run: python generate_samples.py

      - name: Run focused retriever tests
        run: >-
          pytest -q
          tests/test_ingestion.py
          tests/test_similarity_retriever.py
          tests/test_mmr_retriever.py
