name: ContractClaw CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-contractclaw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Sample Contracts
        run: |
          python generate_samples.py

      - name: Run Ingestion Tests
        run: |
          python test_ingestion.py

      - name: Run Similarity Retriever Tests
        run: |
          python test_similarity_retriever.py

      - name: Run MMR Retriever Tests
        run: |
          python test_mmr_retriever.py
